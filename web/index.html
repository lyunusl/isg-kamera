<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111318'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 8.6-8 10.5C11.4 23.6 8 20 8 15V9z' fill='none' stroke='%23ef4b1c' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='15' r='2.6' fill='%23ef4b1c'/%3E%3C/svg%3E">
<title>İSG Kamera</title>
<style>
:root{
  --bg:#f7f5ef;--card:#fff;--line:#e6e2d8;--line2:#d6d1c4;--text:#15171c;--muted:#6b6f7a;--muted2:#9a9ea8;
  --rail:#111318;--accent:#ef4b1c;--accent-light:#fde6dd;--green:#2f8f6b;--green-light:#dff3ea;--yellow:#f2b33d;--yellow-light:#fdf1d4;
  --blue:#2f6fe0;--critical:#d92d20;--high:#ef4b1c;--medium:#f2b33d;--low:#8a93a3;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;--font:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.45 var(--font);display:flex}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.rail{width:72px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;position:sticky;top:0;height:100vh;flex:none;z-index:5}
.rail .brand{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;margin-bottom:14px}
.rail a{width:56px;padding:8px 0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9aa0ad;text-decoration:none;font-size:10.5px;letter-spacing:.01em;position:relative}
.rail a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail a:hover{color:#fff;background:#1d2028}
.rail a.selected{color:#fff;background:#2a1712}.rail a.selected svg{stroke:var(--accent)}
.rail a .badge{position:absolute;top:3px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font:700 10px/17px var(--font);text-align:center;padding:0 4px}
.rail .spacer{flex:1}
.rail .lang{display:flex;gap:2px;margin-top:4px}
.rail .lang button{border:0;background:none;color:#9aa0ad;font:600 10px/1 var(--mono);letter-spacing:.04em;padding:5px 4px;border-radius:6px;cursor:pointer}
.rail .lang button:hover{color:#fff;background:#1d2028}.rail .lang button.selected{color:#fff;background:#2a1712}
main{flex:1;min-width:0;padding:20px 26px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;margin:0;letter-spacing:-.01em;flex:1;min-width:200px}
.top h1 small{display:block;font:500 12.5px var(--font);color:var(--muted);letter-spacing:0;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px;white-space:nowrap}
.chip b{font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--muted2);text-transform:uppercase}
select.chip{appearance:auto;cursor:pointer}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b9b3a3}.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}.btn.main:hover{background:#d93f12}
.btn.dark{background:var(--rail);border-color:var(--rail);color:#fff}.btn.small{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--critical)}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.caption{font:600 10.5px var(--mono);letter-spacing:.09em;color:var(--muted2);text-transform:uppercase}
.grid{display:grid;gap:14px}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.number{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.1;margin:6px 0 2px;display:flex;align-items:baseline;gap:8px}
.number small{font-size:15px;color:var(--muted);font-weight:500}
.delta{font:600 11px var(--mono);padding:2px 7px;border-radius:7px;background:var(--green-light);color:var(--green)}
.delta.bad{background:var(--accent-light);color:var(--accent)}
.note{color:var(--muted);font-size:12.5px}
.bars{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:10px}
.bars i{flex:1;max-width:44px;border-radius:3px 3px 1px 1px;min-height:3px;background:var(--line)}
.cameras{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cam{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0f1115;position:relative;cursor:pointer;aspect-ratio:16/9}
.cam img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.cam .name{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;align-items:center;font:600 10.5px var(--mono);letter-spacing:.06em;color:#fff;text-transform:uppercase}
.cam .name span{background:rgba(10,12,16,.72);padding:3px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam .open{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font:700 11px var(--font);padding:2px 8px;border-radius:8px}
.cam .empty{position:absolute;inset:0;display:grid;place-items:center;color:#7d8391;font-size:12.5px;text-align:center;padding:10px}
.badge{display:inline-block;font:700 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:6px;color:#fff;white-space:nowrap}
.badge.critical{background:var(--critical)}.badge.high{background:var(--high)}.badge.medium{background:var(--yellow);color:#3b2a00}.badge.low{background:#e7e5df;color:#555}
.badge.serious{background:#111318}.badge.grey{background:#eceae3;color:#555}.badge.green{background:var(--green-light);color:var(--green)}
.badge.yellow{background:var(--yellow-light);color:#7a5300}.badge.red{background:var(--accent-light);color:var(--accent)}
.alert{display:flex;gap:11px;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);align-items:center}
.alert:hover,.alert.selected{border-color:var(--accent)}
.alert img,.alert .none{width:104px;height:59px;border-radius:8px;object-fit:cover;background:#16181d;flex:none}
.alert .body{min-width:0;flex:1}.alert .head{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--muted2);text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #f0ede5;vertical-align:middle}td.s,th.s{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{height:7px;border-radius:4px;background:#f0ede5;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.selected{color:var(--text);border-color:var(--accent)}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#0f1115;line-height:0}
.stage img{width:100%;display:block;filter:saturate(.75) brightness(.8)}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage .placeholder{aspect-ratio:16/9;display:grid;place-items:center;color:#7d8391;line-height:1.4;text-align:center;padding:20px}
.strip{display:flex;gap:22px;flex-wrap:wrap;align-items:center;font-size:13.5px;padding:12px 2px 2px}
.strip span b{font-size:15px;margin-left:5px}
.scale{display:flex;align-items:center;gap:8px;font:600 10px var(--mono);letter-spacing:.08em;color:var(--muted2);margin-left:auto}
.scale i{width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,#1f6f78,#f2b33d,#ef4b1c)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--card);border-left:1px solid var(--line2);box-shadow:-18px 0 40px rgba(20,20,20,.12);padding:18px 20px 30px;overflow:auto;z-index:20}
.drawer video,.drawer img.large{width:100%;border-radius:12px;background:#0f1115;display:block}
.drawer h2{margin:0;font-size:19px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.info div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.info b{display:block;font-size:16px}
.form label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:#fff}
.form textarea{min-height:70px;resize:vertical}.form .row{display:flex;gap:8px}.form .row>*{flex:1}
.form input[type=checkbox]{width:auto}
.backdrop{position:fixed;inset:0;background:rgba(15,17,21,.45);z-index:30;display:grid;place-items:center;padding:20px}
.dialog{background:var(--card);border-radius:18px;padding:20px 22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.task{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card)}
.task h3{margin:0;font-size:16px}
.record{background:#0f1115;color:#d7dbe4;border-radius:10px;padding:10px 12px;font:12px/1.5 var(--mono);max-height:230px;overflow:auto;white-space:pre-wrap}
.empty-state{border:1.5px dashed var(--line2);border-radius:16px;padding:34px 24px;text-align:center;color:var(--muted)}
.empty-state h3{color:var(--text);margin:0 0 6px}
.alert-strip{background:var(--yellow-light);border:1px solid #f0d58f;color:#5c4200;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0ede5}.rule:last-child{border:0}
.rule .name{font-weight:650}.rule .desc{color:var(--muted);font-size:12.5px}
.drawing{cursor:crosshair}
.loading{color:var(--muted);padding:30px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--rail);color:#fff;border-radius:12px;padding:10px 16px;z-index:50;font-size:13.5px;max-width:80vw}
.license-warning{bottom:76px;width:min(440px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.24)}
body:has(#tour) .license-warning{display:none}
.license-warning p{margin:0 0 10px}
.license-warning .links{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.license-warning .support{color:#fff;text-decoration:underline}
.license-warning button{margin-left:auto}
#tour{position:fixed;inset:0;z-index:60}
.tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 200vmax rgba(15,17,21,.62);outline:2.5px solid var(--accent);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
.tour-spot.none{outline:0;box-shadow:none;border-radius:0;background:rgba(15,17,21,.62);transition:none}
.tour-card{position:fixed;width:min(370px,calc(100vw - 24px));background:var(--card);border-radius:16px;padding:16px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.3);transition:left .2s,top .2s}
.tour-card h3{margin:0 26px 6px 0;font-size:16.5px}
.tour-card p{margin:0 0 12px;color:#3b3f48;font-size:13.5px;line-height:1.5}
.tour-foot{display:flex;align-items:center;gap:8px}
.tour-count{flex:1;font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--muted2)}
.tour-close{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;line-height:1;color:var(--muted2);cursor:pointer;padding:4px 6px;border-radius:8px}
.tour-close:hover{color:var(--text);background:#f0ede5}
@media(prefers-reduced-motion:reduce){.tour-spot,.tour-card{transition:none}}
@media(max-width:1100px){.three,.four{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:640px){.rail{width:56px}.rail a{width:46px;font-size:0}main{padding:14px 12px 60px}.three,.four{grid-template-columns:1fr}}
/* AugeLab Studio setup wizard */
dialog.wiz{border:0;border-radius:16px;padding:0;width:min(620px,94vw);max-height:calc(100vh - 24px);overflow:auto;background:var(--card);color:var(--text);box-shadow:0 24px 60px rgba(17,19,24,.35)}
dialog.wiz::backdrop{background:rgba(17,19,24,.55)}
dialog.wiz.wide{width:min(980px,96vw)}
.wiz .inner{padding:22px 24px}.wiz.wide .inner{padding:16px 20px}
.wiz-steps{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none;counter-reset:a}.wiz.wide .wiz-steps{margin-bottom:12px}
.wiz-steps li{flex:1;font-size:12px;color:var(--muted);border-top:3px solid var(--line);padding-top:6px;counter-increment:a}
.wiz-steps li::before{content:counter(a) ". "}
.wiz-steps li.current{color:var(--accent);border-color:var(--accent);font-weight:600}
.wiz-steps li.done{color:var(--green);border-color:var(--green)}.wiz-steps li.done::before{content:"✓ "}
.wiz h2{font-size:19px;margin:0 0 8px}.wiz.wide h2{margin-bottom:4px}.wiz p{margin:0 0 10px}
.wiz ol.todo{margin:6px 0 12px;padding-left:20px}.wiz ol.todo li{margin:6px 0}
.wiz kbd{font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.wiz-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.wiz-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.wiz-wait{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.wiz-spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:wiz-spin 1s linear infinite;flex:none}
@keyframes wiz-spin{to{transform:rotate(360deg)}}
.wiz .error{background:var(--accent-light);color:#a3330f;padding:8px 10px;border-radius:8px;font-size:13px}
.wiz-code{display:flex;gap:8px;margin:12px 0 4px}.wiz-code input{flex:1;font:inherit;font-family:ui-monospace,Consolas,monospace;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg,#111);color:var(--text)}
.wiz-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px}
.wiz-account{margin-top:14px}
.wiz-account-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.wiz-account-top b{color:var(--text)}.wiz-account-top a,.wiz-account-top .link{color:var(--accent);white-space:nowrap}
.wiz-account-top .links{display:flex;gap:14px;align-items:baseline}
.wiz-account-top .link{border:0;background:none;font:inherit;cursor:pointer;padding:0;text-decoration:underline}
/* The AugeLab account page starts with a 370 px logo: the frame opens below it, so the sign-up buttons show first. */
.wiz-frame{position:relative;height:min(560px,54vh);overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#111}
.wiz-frame iframe{position:absolute;left:0;top:-370px;width:100%;height:calc(100% + 370px);border:0;display:block}
.wiz-frame.full iframe{top:0;height:100%}
.wiz-scroll{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:wiz-nudge 1.6s ease-in-out infinite;transition:opacity .4s}
.wiz-scroll.gone{opacity:0}
@keyframes wiz-nudge{50%{transform:translate(-50%,5px)}}
@media(prefers-reduced-motion:reduce){.wiz-spin,.wiz-scroll{animation:none}}
</style></head><body>
<nav class="rail" id="rail"></nav>
<main id="page"><div class="loading" data-t>Loading…</div></main>
<div id="overlay"></div>
<dialog id="wizard" class="wiz"><div class="inner">
  <ol class="wiz-steps"><li data-t>Install Studio</li><li data-t>AugeLab account</li><li data-t>License code</li><li data-t>Ready</li></ol>
  <div id="wiz-body"></div>
  <div id="wiz-account" class="wiz-account" hidden>
    <div class="wiz-account-top"><span id="wiz-account-text"></span><span class="links"><button class="btn small" id="wiz-have-account" type="button" data-t>I have an account</button><button class="link" id="wiz-top" type="button" data-t>Show the top of the page</button><a id="wiz-account-link" target="_blank" rel="noopener"><span data-t>Open in a new window</span> ↗</a></span></div>
    <div class="wiz-frame" id="wiz-frame"><iframe id="wiz-iframe" title="AugeLab account" data-t-attr="title"></iframe><div class="wiz-scroll" id="wiz-scroll"><span data-t>Scroll down in the frame for the rest of the form</span> ↓</div></div>
  </div>
  <div class="wiz-foot"><button class="btn small" id="wiz-later" type="button" data-t>Later</button><span id="wiz-action"></span></div>
</div></dialog>
<aside class="toast license-warning" id="license-warning" aria-label="AugeLab license notice" data-t-attr="aria-label" hidden>
  <p role="status" data-t>Your Community period has ended. AugeLab Studio is now applying an FPS limit.</p>
  <div class="links">
    <a class="btn small" href="https://account.augelab.com/purchase" target="_blank" rel="noopener noreferrer" data-t>View plans</a>
    <a class="support" href="mailto:info@augelab.de">info@augelab.de</a>
    <button class="btn small" id="license-warning-close" type="button" data-t>Close</button>
  </div>
</aside>
<script src="/web/i18n.js"></script>
<script src="/web/app.js"></script>
<script src="/web/tour.js"></script>
</body></html>
